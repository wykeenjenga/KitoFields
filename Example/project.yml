name: KitoFieldsExample
options:
  bundleIdPrefix: co.triply
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  KitoFields:
    path: ..
targets:
  KitoFieldsExample:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: KitoFields
    settings:
      base:
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
